name: Pipeline Container App

# Pipeline completa de Container App en un solo run:
#
#   build+push (UT) -> deploy int -> deploy sbx
#                   -> deploy pro (label staging, 0% trafico) -> promote
#
# Container Apps no tiene slots: el stage de staging es una revision con label
# (accesible en https://<app>---staging.<fqdn>) y el promote mueve el 100% del trafico.
#
# Caller minimo:
#
#   jobs:
#     pipeline:
#       uses: APS-Framework/.github/.github/workflows/pipeline-container-app.yml@main
#       secrets: inherit
#
# Environments requeridos en el repo caller (int, sbx, pro):
#   vars:    CONTAINER_APP_NAME, RESOURCE_GROUP
#   repo/org vars: ACR_NAME, CONTAINER_REPOSITORY (ACR compartido; los usa el build)
#   secrets: AZURE_* (identidad de push del build) y, si no se usan org vars,
#            AZURE_*_<ENV> para los deploys (ver README-deploy.md)

on:
  workflow_call:
    inputs:
      dotnet_version:
        description: 'Version(es) del SDK de .NET (multilinea para varias)'
        required: false
        type: string
        default: '8.x'
      unit_test_project:
        description: 'Glob de tests unitarios. Vacio = no ejecutar.'
        required: false
        type: string
        default: '**/*UnitTest*.csproj'
      integration_test_project:
        description: 'Glob de integration tests. Vacio = no ejecutar.'
        required: false
        type: string
        default: '**/*IntegrationTest*.csproj'
    secrets:
      APS_NUGET_TOKEN:
        description: 'PAT con scope read:packages para feeds NuGet privados'
        required: true
      NUGET_EXTERNAL_TOKEN:
        description: 'Token opcional para feeds NuGet externos'
        required: false

jobs:
  build:
    uses: ./.github/workflows/container-app-build.yml
    with:
      dotnet_version: ${{ inputs.dotnet_version }}
      unit_test_project: ${{ inputs.unit_test_project }}
    secrets: inherit

  deploy-int:
    needs: build
    uses: ./.github/workflows/container-app-deploy.yml
    with:
      environment: int
      image: ${{ needs.build.outputs.image }}
      dotnet_version: ${{ inputs.dotnet_version }}
      integration_test_project: ${{ inputs.integration_test_project }}
      azure_client_id: ${{ vars.AZURE_CLIENT_ID_INT }}
      azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID_INT }}
    secrets: inherit

  deploy-sbx:
    needs: deploy-int
    uses: ./.github/workflows/container-app-deploy.yml
    with:
      environment: sbx
      image: ${{ needs.build.outputs.image }}
      dotnet_version: ${{ inputs.dotnet_version }}
      integration_test_project: ${{ inputs.integration_test_project }}
      azure_client_id: ${{ vars.AZURE_CLIENT_ID_SBX }}
      azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID_SBX }}
    secrets: inherit

  deploy-pro:
    needs: deploy-sbx
    uses: ./.github/workflows/container-app-deploy.yml
    with:
      environment: pro
      image: ${{ needs.build.outputs.image }}
      dotnet_version: ${{ inputs.dotnet_version }}
      integration_test_project: ${{ inputs.integration_test_project }}
      staging_label: staging
      azure_client_id: ${{ vars.AZURE_CLIENT_ID_PRO }}
      azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID_PRO }}
    secrets: inherit

  promote-pro:
    needs: deploy-pro
    uses: ./.github/workflows/container-app-promote.yml
    with:
      environment: pro
      label: staging
      azure_client_id: ${{ vars.AZURE_CLIENT_ID_PRO }}
      azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID_PRO }}
    secrets: inherit
