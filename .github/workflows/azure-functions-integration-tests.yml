name: Azure Functions Integration Tests

# Workflow reutilizable: gate de integration tests previo al deploy de una Function App.
# Es la PRIMERA linea visible de cada stage (INT/SBX/PRO): autentica con la identidad
# OIDC del job (azure/login) y ejecuta los tests con TEST_STAGE = environment en mayusculas.
#
# Uso recomendado: pipeline-functions.yml (orquesta tests -> deploy -> config sync por stage).
#
# Resolucion de configuracion:
#   - azure_* -> vars de org sufijadas (AZURE_CLIENT_ID_INT...) o secrets del environment.
#   - app_config_prefix / app_config_endpoint -> vars de org (los tests componen el endpoint
#     del App Configuration del stage cuando no hay connection string en el entorno).

on:
  workflow_call:
    inputs:
      environment:
        description: 'GitHub Environment del stage (int, sbx, pro…)'
        required: true
        type: string
      integration_test_project:
        description: 'Glob de proyectos de integration test. Vacio = no ejecutar tests.'
        required: false
        type: string
        default: '**/*IntegrationTest*.csproj'
      integration_test_stage:
        description: 'Valor de TEST_STAGE para los tests. Vacio = environment en mayusculas.'
        required: false
        type: string
        default: ''
      dotnet_version:
        description: 'Version(es) del SDK de .NET a instalar (multilinea para varias)'
        required: false
        type: string
        default: '8.x'
      configuration:
        description: 'Configuracion usada por los integration tests'
        required: false
        type: string
        default: Release
      azure_client_id:
        description: 'Client ID OIDC. Vacio = usa el secret AZURE_CLIENT_ID del environment.'
        required: false
        type: string
        default: ''
      azure_tenant_id:
        description: 'Tenant ID. Vacio = usa el secret AZURE_TENANT_ID del environment.'
        required: false
        type: string
        default: ''
      azure_subscription_id:
        description: 'Subscription ID. Vacio = usa el secret AZURE_SUBSCRIPTION_ID del environment.'
        required: false
        type: string
        default: ''
    secrets:
      AZURE_CLIENT_ID:
        description: 'Client ID para OIDC (alternativa al input azure_client_id)'
        required: false
      AZURE_TENANT_ID:
        description: 'Tenant ID de Azure AD (alternativa al input azure_tenant_id)'
        required: false
      AZURE_SUBSCRIPTION_ID:
        description: 'Subscription ID de Azure (alternativa al input azure_subscription_id)'
        required: false
      APS_NUGET_TOKEN:
        description: 'PAT con scope read:packages para feeds NuGet privados'
        required: true
      NUGET_EXTERNAL_TOKEN:
        description: 'Token opcional para feeds NuGet externos'
        required: false

jobs:
  tests:
    name: Integration tests
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ inputs.azure_client_id || vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ inputs.azure_tenant_id || vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ inputs.azure_subscription_id || vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run integration tests
        if: inputs.integration_test_project != ''
        uses: APS-Framework/.github/.github/actions/integration-tests@main
        with:
          project: ${{ inputs.integration_test_project }}
          stage: ${{ inputs.integration_test_stage }}
          environment: ${{ inputs.environment }}
          configuration: ${{ inputs.configuration }}
          app_config_prefix: ${{ vars.APP_CONFIG_PREFIX }}
          app_config_endpoint: ${{ vars.APP_CONFIG_ENDPOINT }}
          aps_nuget_token: ${{ secrets.APS_NUGET_TOKEN }}
          nuget_external_token: ${{ secrets.NUGET_EXTERNAL_TOKEN }}
