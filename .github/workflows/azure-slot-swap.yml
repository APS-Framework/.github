name: App Service Slot Swap

# Workflow reutilizable: swap de un slot a production (Functions o Web App).
# Es el stage posterior al deploy en slot 'staging' del flujo build once / promote.
# El config sync de Key Vault + App Configuration es una linea propia del stage,
# orquestada por pipeline-functions.yml tras este swap.
#
# Re-ejecutar este workflow sobre el mismo entorno invierte el swap:
# es el rollback sin redeploy (paridad con Swap_PRO de las pipelines CS.Level.*).
#
# Resolucion de configuracion (cae al GitHub Environment si no se pasa input):
#   - app_name             -> vars.FUNCTION_APP_NAME (function) o vars.WEBAPP_NAME (webapp)
#   - resource_group       -> vars.RESOURCE_GROUP (o se resuelve por nombre)
#   - key_vault_name       -> vars.KEY_VAULT_NAME
#   - app_config_name      -> vars.APP_CONFIG_NAME
#   - label                -> vars.LABEL
#   - url_value_prefix     -> vars.URL_VALUE_PREFIX
#   - api_key_value_prefix -> vars.API_KEY_VALUE_PREFIX
#   - azure_*              -> secrets.AZURE_* (o vars de org sufijadas, que pasa el orquestador)

on:
  workflow_call:
    inputs:
      environment:
        description: 'GitHub Environment del swap (int, sbx, pro…)'
        required: true
        type: string
      app_type:
        description: 'Tipo de recurso: function o webapp'
        required: true
        type: string
      app_name:
        description: 'Nombre completo. Vacio = usa la variable del environment segun app_type.'
        required: false
        type: string
        default: ''
      source_slot:
        description: 'Slot origen (contiene la version nueva)'
        required: false
        type: string
        default: staging
      target_slot:
        description: 'Slot destino (production)'
        required: false
        type: string
        default: production
      preserve_vnet:
        description: 'Preservar la configuracion de Virtual Network en el swap (solo Web Apps)'
        required: false
        type: boolean
        default: false
      resource_group:
        description: 'Resource group. Vacio = usa la variable RESOURCE_GROUP del environment o lo resuelve por nombre.'
        required: false
        type: string
        default: ''
      key_vault_name:
        description: 'Key Vault destino del config sync. Vacio = usa KEY_VAULT_NAME del environment.'
        required: false
        type: string
        default: ''
      app_config_name:
        description: 'App Configuration destino del config sync. Vacio = usa APP_CONFIG_NAME del environment.'
        required: false
        type: string
        default: ''
      label:
        description: 'Label de App Configuration. Vacio = usa LABEL del environment.'
        required: false
        type: string
        default: ''
      url_value_prefix:
        description: 'Clave de App Config para la URL base. Vacio = usa URL_VALUE_PREFIX del environment.'
        required: false
        type: string
        default: ''
      api_key_value_prefix:
        description: 'Clave de App Config para la API key. Vacio = usa API_KEY_VALUE_PREFIX del environment.'
        required: false
        type: string
        default: ''
      api_key_vault_name:
        description: "Nombre del secreto en Key Vault. Vacio = api_key_value_prefix con '.' reemplazado por '-'."
        required: false
        type: string
        default: ''
      function_key_name:
        description: 'Nombre de la function key a publicar (functionKeys.<nombre>)'
        required: false
        type: string
        default: 'default'
      azure_client_id:
        description: 'Client ID OIDC. Vacio = usa el secret AZURE_CLIENT_ID del environment.'
        required: false
        type: string
        default: ''
      azure_tenant_id:
        description: 'Tenant ID. Vacio = usa el secret AZURE_TENANT_ID del environment.'
        required: false
        type: string
        default: ''
      azure_subscription_id:
        description: 'Subscription ID. Vacio = usa el secret AZURE_SUBSCRIPTION_ID del environment.'
        required: false
        type: string
        default: ''
    secrets:
      AZURE_CLIENT_ID:
        description: 'Client ID para OIDC (alternativa al input azure_client_id)'
        required: false
      AZURE_TENANT_ID:
        description: 'Tenant ID de Azure AD (alternativa al input azure_tenant_id)'
        required: false
      AZURE_SUBSCRIPTION_ID:
        description: 'Subscription ID de Azure (alternativa al input azure_subscription_id)'
        required: false

jobs:
  swap:
    name: Swap ${{ inputs.source_slot }} → ${{ inputs.target_slot }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    env:
      KEY_VAULT_NAME: ${{ inputs.key_vault_name || vars.KEY_VAULT_NAME }}
      APP_CONFIG_NAME: ${{ inputs.app_config_name || vars.APP_CONFIG_NAME }}
      LABEL: ${{ inputs.label || vars.LABEL }}
      URL_VALUE_PREFIX: ${{ inputs.url_value_prefix || vars.URL_VALUE_PREFIX }}
      API_KEY_VALUE_PREFIX: ${{ inputs.api_key_value_prefix || vars.API_KEY_VALUE_PREFIX }}
      API_KEY_VAULT_NAME: ${{ inputs.api_key_vault_name }}
      FUNCTION_KEY_NAME: ${{ inputs.function_key_name }}

    steps:
      - name: Validate configuration
        run: |
          set -euo pipefail
          if [ "$APP_TYPE" != "function" ] && [ "$APP_TYPE" != "webapp" ]; then
            echo "::error::app_type debe ser 'function' o 'webapp' (recibido: '$APP_TYPE')."
            exit 1
          fi
          if [ -z "$APP_NAME" ]; then
            echo "::error::Nombre de app no definido. Configura FUNCTION_APP_NAME/WEBAPP_NAME en el environment '${{ inputs.environment }}' o pasa app_name."
            exit 1
          fi

          missing=()
          if [ "$APP_TYPE" = "function" ] && { [ -n "$URL_VALUE_PREFIX" ] || [ -n "$API_KEY_VALUE_PREFIX" ]; }; then
            [ -z "$KEY_VAULT_NAME" ] && missing+=("KEY_VAULT_NAME")
            [ -z "$APP_CONFIG_NAME" ] && missing+=("APP_CONFIG_NAME")
            [ -z "$LABEL" ] && missing+=("LABEL")
            [ -z "$URL_VALUE_PREFIX" ] && missing+=("URL_VALUE_PREFIX")
            [ -z "$API_KEY_VALUE_PREFIX" ] && missing+=("API_KEY_VALUE_PREFIX")
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Faltan variables en el environment '${{ inputs.environment }}': ${missing[*]}"
            exit 1
          fi
        env:
          APP_TYPE: ${{ inputs.app_type }}
          APP_NAME: ${{ inputs.app_name || (inputs.app_type == 'function' && vars.FUNCTION_APP_NAME) || vars.WEBAPP_NAME }}

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ inputs.azure_client_id || vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ inputs.azure_tenant_id || vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ inputs.azure_subscription_id || vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Swap slot
        id: swap
        run: |
          set -euo pipefail

          RG="$RESOURCE_GROUP_INPUT"
          if [ -z "$RG" ]; then
            if [ "$APP_TYPE" = "function" ]; then
              RG=$(az functionapp list --query "[?name=='$APP_NAME'].resourceGroup" -o tsv)
            else
              RG=$(az webapp list --query "[?name=='$APP_NAME'].resourceGroup" -o tsv)
            fi
          fi
          if [ -z "$RG" ]; then
            echo "::error::No se encontro '$APP_NAME'."
            exit 1
          fi

          if [ "$APP_TYPE" = "function" ]; then
            az functionapp deployment slot swap \
              --name "$APP_NAME" \
              --resource-group "$RG" \
              --slot "$SOURCE_SLOT" \
              --target-slot "$TARGET_SLOT"
          else
            az webapp deployment slot swap \
              --name "$APP_NAME" \
              --resource-group "$RG" \
              --slot "$SOURCE_SLOT" \
              --target-slot "$TARGET_SLOT" \
              --preserve-vnet "$PRESERVE_VNET"
          fi

          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "resource_group=$RG" >> "$GITHUB_OUTPUT"
        env:
          APP_TYPE: ${{ inputs.app_type }}
          APP_NAME: ${{ inputs.app_name || (inputs.app_type == 'function' && vars.FUNCTION_APP_NAME) || vars.WEBAPP_NAME }}
          SOURCE_SLOT: ${{ inputs.source_slot }}
          TARGET_SLOT: ${{ inputs.target_slot }}
          PRESERVE_VNET: ${{ inputs.preserve_vnet }}
          RESOURCE_GROUP_INPUT: ${{ inputs.resource_group || vars.RESOURCE_GROUP }}

      - name: Swap summary
        if: always()
        run: |
          echo "## 🔁 Slot Swap Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | \`${{ inputs.environment }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **App** | \`${{ inputs.app_name || (inputs.app_type == 'function' && vars.FUNCTION_APP_NAME) || vars.WEBAPP_NAME }}\` (${{ inputs.app_type }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Swap** | \`${{ inputs.source_slot }}\` → \`${{ inputs.target_slot }}\` |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.swap.outcome }}" == "success" ]; then
            echo "| **Status** | ✅ Success |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> Re-ejecutar este workflow invierte el swap (rollback sin redeploy)." >> $GITHUB_STEP_SUMMARY
          else
            echo "| **Status** | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
