name: Container App Build & Push

# Workflow reutilizable: tests unitarios + docker build + push a ACR.
# Primera etapa del flujo build once / promote: publica la imagen una sola vez
# y los deploys de cada entorno reutilizan el mismo tag.
#
# Uso recomendado: pipeline-container-app.yml.
#
# Configuracion: acr_name y container_repository caen a las variables de repo/org
# ACR_NAME y CONTAINER_REPOSITORY (el ACR es compartido por todos los entornos).

on:
  workflow_call:
    inputs:
      acr_name:
        description: 'Azure Container Registry (sin .azurecr.io). Vacio = usa la variable ACR_NAME.'
        required: false
        type: string
        default: ''
      container_repository:
        description: 'Repositorio de imagen dentro del ACR. Vacio = usa la variable CONTAINER_REPOSITORY.'
        required: false
        type: string
        default: ''
      image_tag:
        description: 'Tag de la imagen. Vacio = primeros 7 caracteres del SHA del commit.'
        required: false
        type: string
        default: ''
      dockerfile:
        description: 'Ruta al Dockerfile relativa a la raiz del repo'
        required: false
        type: string
        default: './Dockerfile'
      docker_build_context:
        description: 'Contexto de construccion Docker relativo a la raiz del repo'
        required: false
        type: string
        default: '.'
      dotnet_version:
        description: 'Version(es) del SDK de .NET a instalar (multilinea para varias)'
        required: false
        type: string
        default: '8.x'
      unit_test_project:
        description: 'Glob de proyectos de test unitario. Vacio = no ejecutar tests.'
        required: false
        type: string
        default: '**/*UnitTest*.csproj'
      configuration:
        description: 'Configuracion usada por los tests unitarios'
        required: false
        type: string
        default: Release
      azure_client_id:
        description: 'Client ID OIDC. Vacio = usa var/secret AZURE_CLIENT_ID.'
        required: false
        type: string
        default: ''
      azure_tenant_id:
        description: 'Tenant ID. Vacio = usa var/secret AZURE_TENANT_ID.'
        required: false
        type: string
        default: ''
      azure_subscription_id:
        description: 'Subscription ID. Vacio = usa var/secret AZURE_SUBSCRIPTION_ID.'
        required: false
        type: string
        default: ''
    secrets:
      AZURE_CLIENT_ID:
        description: 'Client ID para OIDC (alternativa al input azure_client_id)'
        required: false
      AZURE_TENANT_ID:
        description: 'Tenant ID de Azure AD (alternativa al input azure_tenant_id)'
        required: false
      AZURE_SUBSCRIPTION_ID:
        description: 'Subscription ID de Azure (alternativa al input azure_subscription_id)'
        required: false
      APS_NUGET_TOKEN:
        description: 'PAT con scope read:packages. Se pasa tambien como --build-arg al docker build.'
        required: true
      NUGET_EXTERNAL_TOKEN:
        description: 'Token opcional para feeds NuGet externos'
        required: false
    outputs:
      image:
        description: 'Referencia completa de la imagen (acr.azurecr.io/repo:tag)'
        value: ${{ jobs.build.outputs.image }}
      image_tag:
        description: 'Tag de la imagen publicada (SHA corto o input)'
        value: ${{ jobs.build.outputs.image_tag }}
      acr_login_server:
        description: 'Login server del ACR'
        value: ${{ jobs.build.outputs.acr_login_server }}

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.docker.outputs.image }}
      image_tag: ${{ steps.tag.outputs.value }}
      acr_login_server: ${{ steps.acr.outputs.login_server }}
    env:
      ACR_NAME: ${{ inputs.acr_name || vars.ACR_NAME }}
      CONTAINER_REPOSITORY: ${{ inputs.container_repository || vars.CONTAINER_REPOSITORY }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Validate configuration
        run: |
          set -euo pipefail
          if [ -z "$ACR_NAME" ] || [ -z "$CONTAINER_REPOSITORY" ]; then
            echo "::error::ACR_NAME y/o CONTAINER_REPOSITORY no definidos. Configura las variables de repo/org o pasa acr_name/container_repository."
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Unit tests
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          if [ -z "${UNIT_TEST_PROJECT// }" ]; then
            echo "Sin tests unitarios configurados (unit_test_project vacio)."
            exit 0
          fi

          files=( $UNIT_TEST_PROJECT )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No se encontro ningun proyecto con el patron '$UNIT_TEST_PROJECT'."
            exit 1
          fi

          projects=()
          for file in "${files[@]}"; do
            case "$file" in
              */bin/*|*/obj/*) continue ;;
            esac
            projects+=("$file")
          done
          if [ ${#projects[@]} -eq 0 ]; then
            echo "::error::Solo hubo coincidencias en bin/obj para '$UNIT_TEST_PROJECT'."
            exit 1
          fi

          for project in "${projects[@]}"; do
            echo "== dotnet test ${project} =="
            dotnet test "$project" --configuration "$CONFIGURATION"
          done
        env:
          UNIT_TEST_PROJECT: ${{ inputs.unit_test_project }}
          CONFIGURATION: ${{ inputs.configuration }}
          APS_NUGET_TOKEN: ${{ secrets.APS_NUGET_TOKEN }}
          NUGET_EXTERNAL_TOKEN: ${{ secrets.NUGET_EXTERNAL_TOKEN }}

      - name: Compute image tag
        id: tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "value=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ inputs.azure_client_id || vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ inputs.azure_tenant_id || vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ inputs.azure_subscription_id || vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR Login & resolve server
        id: acr
        run: |
          az acr login --name "$ACR_NAME"
          LOGIN_SERVER=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
          echo "login_server=$LOGIN_SERVER" >> "$GITHUB_OUTPUT"

      - name: Docker build & push
        id: docker
        run: |
          IMAGE="${{ steps.acr.outputs.login_server }}/$CONTAINER_REPOSITORY:${{ steps.tag.outputs.value }}"
          docker build \
            -f "${{ inputs.dockerfile }}" \
            -t "$IMAGE" \
            --build-arg APS_NUGET_TOKEN="${{ secrets.APS_NUGET_TOKEN }}" \
            "${{ inputs.docker_build_context }}"
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "## 🐳 Imagen publicada" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **ACR** | \`$ACR_NAME\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Imagen** | \`$IMAGE\` |" >> $GITHUB_STEP_SUMMARY
