name: Container App Promote

# Workflow reutilizable: mueve el 100% del trafico de una Container App a un
# label o a una revision concreta. Es el equivalente al swap de slots de
# App Service en el flujo build once / promote.
#
# Re-ejecutar con la revision anterior mueve el trafico de vuelta:
# rollback sin redeploy.
#
# Uso recomendado: pipeline-container-app.yml.
#
# Resolucion de configuracion (cae al GitHub Environment si no se pasa input):
#   - container_app_name -> vars.CONTAINER_APP_NAME
#   - resource_group     -> vars.RESOURCE_GROUP
#   - azure_*            -> secrets.AZURE_* (o vars de org sufijadas)

on:
  workflow_call:
    inputs:
      environment:
        description: 'GitHub Environment del promote (int, sbx, pro…)'
        required: true
        type: string
      container_app_name:
        description: 'Container App. Vacio = usa CONTAINER_APP_NAME del environment.'
        required: false
        type: string
        default: ''
      resource_group:
        description: 'Resource group. Vacio = usa RESOURCE_GROUP del environment.'
        required: false
        type: string
        default: ''
      label:
        description: 'Label de trafico a promover (ej. staging). Excluyente con revision.'
        required: false
        type: string
        default: ''
      revision:
        description: 'Revision concreta a promover (para rollback). Excluyente con label.'
        required: false
        type: string
        default: ''
      weight:
        description: 'Peso de trafico (0-100)'
        required: false
        type: number
        default: 100
      azure_client_id:
        description: 'Client ID OIDC. Vacio = usa el secret AZURE_CLIENT_ID del environment.'
        required: false
        type: string
        default: ''
      azure_tenant_id:
        description: 'Tenant ID. Vacio = usa el secret AZURE_TENANT_ID del environment.'
        required: false
        type: string
        default: ''
      azure_subscription_id:
        description: 'Subscription ID. Vacio = usa el secret AZURE_SUBSCRIPTION_ID del environment.'
        required: false
        type: string
        default: ''
    secrets:
      AZURE_CLIENT_ID:
        description: 'Client ID para OIDC (alternativa al input azure_client_id)'
        required: false
      AZURE_TENANT_ID:
        description: 'Tenant ID de Azure AD (alternativa al input azure_tenant_id)'
        required: false
      AZURE_SUBSCRIPTION_ID:
        description: 'Subscription ID de Azure (alternativa al input azure_subscription_id)'
        required: false

jobs:
  promote:
    name: Promote traffic
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    env:
      APP_NAME: ${{ inputs.container_app_name || vars.CONTAINER_APP_NAME }}
      RESOURCE_GROUP: ${{ inputs.resource_group || vars.RESOURCE_GROUP }}

    steps:
      - name: Validate configuration
        run: |
          set -euo pipefail
          if [ -z "$APP_NAME" ] || [ -z "$RESOURCE_GROUP" ]; then
            echo "::error::CONTAINER_APP_NAME y/o RESOURCE_GROUP no definidos en el environment '${{ inputs.environment }}'."
            exit 1
          fi
          if [ -n "$LABEL" ] && [ -n "$REVISION" ]; then
            echo "::error::Indica solo uno de 'label' o 'revision'."
            exit 1
          fi
          if [ -z "$LABEL" ] && [ -z "$REVISION" ]; then
            echo "::error::Debes indicar 'label' o 'revision'."
            exit 1
          fi
          if [ "$WEIGHT" -lt 0 ] || [ "$WEIGHT" -gt 100 ]; then
            echo "::error::weight debe estar entre 0 y 100."
            exit 1
          fi
        env:
          LABEL: ${{ inputs.label }}
          REVISION: ${{ inputs.revision }}
          WEIGHT: ${{ inputs.weight }}

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ inputs.azure_client_id || vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ inputs.azure_tenant_id || vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ inputs.azure_subscription_id || vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set traffic
        id: promote
        run: |
          set -euo pipefail

          if [ -n "$LABEL" ]; then
            az containerapp ingress traffic set \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --label-weight "$LABEL=$WEIGHT"
            echo "target=$LABEL (label)" >> "$GITHUB_OUTPUT"
          else
            az containerapp ingress traffic set \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --revision-weight "$REVISION=$WEIGHT"
            echo "target=$REVISION (revision)" >> "$GITHUB_OUTPUT"
          fi
        env:
          LABEL: ${{ inputs.label }}
          REVISION: ${{ inputs.revision }}
          WEIGHT: ${{ inputs.weight }}

      - name: Promote summary
        if: always()
        run: |
          echo "## 🔀 Traffic Promote Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | \`${{ inputs.environment }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Container App** | \`$APP_NAME\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target** | \`${{ steps.promote.outputs.target }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Weight** | ${{ inputs.weight }}% |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.promote.outcome }}" == "success" ]; then
            echo "| **Status** | ✅ Success |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> Para rollback: re-ejecutar con la revision anterior en el input 'revision'." >> $GITHUB_STEP_SUMMARY
          else
            echo "| **Status** | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
