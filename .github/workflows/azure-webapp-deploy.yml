name: Azure Web App Deploy

# Workflow reutilizable: integration tests + deploy de una App Service Web App
# desde un artifact. Etapa del flujo build once / promote: NO compila; consume
# el artifact de dotnet-build.yml.
#
# Cadena tipica (caller):
#
#   jobs:
#     build:      -> dotnet-build.yml
#     deploy-int: -> azure-webapp-deploy.yml (environment: int)
#     deploy-dev: -> azure-webapp-deploy.yml (environment: dev, needs deploy-int)
#     deploy-pro: -> azure-webapp-deploy.yml (environment: pro, slot: staging)
#     swap-pro:   -> azure-slot-swap.yml     (staging -> production, re-run = rollback)
#
# Los integration tests corren como gate previo al deploy dentro del mismo job,
# contra el entorno del GitHub Environment. Requieren que el proyecto de tests
# exista en el repo (se hace checkout) y usan TEST_STAGE = environment en mayusculas.
#
# Uso desde el repo consumidor:
#
#   jobs:
#     build:
#       uses: APS-Framework/.github/.github/workflows/dotnet-build.yml@main
#       with:
#         project_path:  src/My.WebApp/My.WebApp.csproj
#         artifact_name: app-drop
#       secrets: inherit
#
#     deploy-dev:
#       needs: build
#       uses: APS-Framework/.github/.github/workflows/azure-webapp-deploy.yml@main
#       with:
#         environment:  dev
#         webapp_name:  my-webapp-dev
#         artifact_name: app-drop
#       secrets: inherit

on:
  workflow_call:
    inputs:
      environment:
        description: 'GitHub Environment del deploy (dev, int, sbx, pro…)'
        required: true
        type: string
      webapp_name:
        description: 'Nombre completo de la Web App destino'
        required: true
        type: string
      artifact_name:
        description: 'Artifact generado por dotnet-build.yml'
        required: true
        type: string
      slot:
        description: "Slot destino. Vacio = production. Ej: 'staging' para el deploy previo al swap."
        required: false
        type: string
        default: ''
      integration_test_project:
        description: 'Glob de proyectos de integration test. Vacio = no ejecutar tests.'
        required: false
        type: string
        default: '**/*IntegrationTest*.csproj'
      integration_test_stage:
        description: 'Valor de TEST_STAGE para los tests. Vacio = environment en mayusculas.'
        required: false
        type: string
        default: ''
      dotnet_version:
        description: 'Version(es) del SDK de .NET a instalar (multilinea para varias)'
        required: false
        type: string
        default: '8.x'
      configuration:
        description: 'Configuracion usada por los integration tests'
        required: false
        type: string
        default: Release
    secrets:
      AZURE_CLIENT_ID:
        description: 'Client ID para OIDC'
        required: true
      AZURE_TENANT_ID:
        description: 'Tenant ID de Azure AD'
        required: true
      AZURE_SUBSCRIPTION_ID:
        description: 'Subscription ID de Azure'
        required: true
      APS_NUGET_TOKEN:
        description: 'PAT con scope read:packages para feeds NuGet privados'
        required: true
      NUGET_EXTERNAL_TOKEN:
        description: 'Token opcional para feeds NuGet externos'
        required: false

jobs:
  deploy:
    name: Deploy → ${{ inputs.webapp_name }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Gate previo al deploy. Los tests usan la identidad OIDC del job
      # (azure/login autentica el CLI, por lo que DefaultAzureCredential ->
      # AzureCliCredential funciona sin credenciales adicionales).
      - name: Integration tests
        if: inputs.integration_test_project != ''
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          stage="$INTEGRATION_TEST_STAGE"
          if [ -z "$stage" ]; then
            stage=$(echo "$ENVIRONMENT" | tr '[:lower:]' '[:upper:]')
          fi
          export TEST_STAGE="$stage"

          files=( $INTEGRATION_TEST_PROJECT )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No se encontro ningun proyecto con el patron '$INTEGRATION_TEST_PROJECT'."
            exit 1
          fi

          projects=()
          for file in "${files[@]}"; do
            case "$file" in
              */bin/*|*/obj/*) continue ;;
            esac
            projects+=("$file")
          done
          if [ ${#projects[@]} -eq 0 ]; then
            echo "::error::Solo hubo coincidencias en bin/obj para '$INTEGRATION_TEST_PROJECT'."
            exit 1
          fi

          for project in "${projects[@]}"; do
            echo "== dotnet test ${project} (TEST_STAGE=$TEST_STAGE) =="
            dotnet test "$project" --configuration "$CONFIGURATION" --filter "TestCategory=Integration"
          done
        env:
          INTEGRATION_TEST_PROJECT: ${{ inputs.integration_test_project }}
          INTEGRATION_TEST_STAGE: ${{ inputs.integration_test_stage }}
          ENVIRONMENT: ${{ inputs.environment }}
          CONFIGURATION: ${{ inputs.configuration }}
          APP_CONFIG_CONNECTION: ${{ secrets.APP_CONFIG_CONNECTION }}
          APS_NUGET_TOKEN: ${{ secrets.APS_NUGET_TOKEN }}
          NUGET_EXTERNAL_TOKEN: ${{ secrets.NUGET_EXTERNAL_TOKEN }}

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}
          path: ./publish

      - name: Deploy to Azure Web App
        id: deploy
        run: |
          set -euo pipefail
          RG=$(az webapp list --query "[?name=='$APP_NAME'].resourceGroup" -o tsv)
          if [ -z "$RG" ]; then
            echo "::error::No se encontro la Web App '$APP_NAME'."
            exit 1
          fi

          cd ./publish
          zip -r ../webapp.zip .
          cd ..

          SLOT_ARGS=()
          if [ -n "$SLOT" ]; then
            SLOT_ARGS=(--slot "$SLOT")
          fi

          az webapp deploy \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --src-path ./webapp.zip \
            --type zip \
            "${SLOT_ARGS[@]}"
        env:
          APP_NAME: ${{ inputs.webapp_name }}
          SLOT: ${{ inputs.slot }}

      - name: Deployment summary
        if: always()
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | \`${{ inputs.environment }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Web App** | \`${{ inputs.webapp_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Slot** | \`${{ inputs.slot || 'production' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Artifact** | \`${{ inputs.artifact_name }}\` |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.deploy.outcome }}" == "success" ]; then
            echo "| **Status** | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **Status** | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
