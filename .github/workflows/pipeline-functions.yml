name: Pipeline Functions

# Pipeline completa de Functions en un solo run (equivalente a las stages de ADO):
#
#   build (UT) -> deploy int (ITs -> deploy -> config sync)
#              -> deploy sbx (ITs -> deploy -> config sync)
#              -> deploy pro (ITs -> deploy slot staging) -> swap (+ config sync pro)
#
# El config sync de int/sbx corre dentro del propio job de deploy; en pro se ejecuta
# dentro del job del swap, ya que el deploy va al slot staging.
#
# Los entornos son fijos (int, sbx, pro) y las aprobaciones se configuran como
# protection rules de cada GitHub Environment del repo caller.
#
# Selección de entornos: `deploy_int`/`deploy_sbx`/`deploy_pro` permiten promoción
# completa (default), parcial (int+sbx, sbx+pro) o un entorno suelto (hotfix). Cada job
# encadena con el ANTERIOR con always() + checks de resultado (un job saltado no bloquea;
# uno fallido sí). La combinación int+pro sin sbx es inválida y la bloquea `validate`.
#
# Nombres de recursos: con los prefijos (function_app_prefix, key_vault_prefix,
# app_config_prefix, resource_group_prefix) el pipeline compone `<prefijo>-<entorno>`
# (sbx usa el sufijo 'dev'). Si van vacíos, el deploy resuelve las vars del environment
# (FUNCTION_APP_NAME, KEY_VAULT_NAME, APP_CONFIG_NAME, ...).
#
# build: por defecto true (el pipeline construye y sube el artifact). Pasar `build: false`
# cuando el caller ya haya construido el artifact en su propio job (p. ej. para encadenar
# el publish tras esa build sin duplicarla).
#
# Caller mínimo:
#
#   jobs:
#     pipeline:
#       uses: APS-Framework/.github/.github/workflows/pipeline-functions.yml@main
#       secrets: inherit
#
# Valores de Azure: se toman de las org vars AZURE_CLIENT_ID_<ENV>,
# AZURE_SUBSCRIPTION_ID_<ENV> y AZURE_TENANT_ID; si no existen, el bloque cae a
# los secrets AZURE_* del environment.

on:
  workflow_call:
    inputs:
      build:
        description: 'Construir y subir el artifact. false = el caller ya lo construyó y subió.'
        required: false
        type: boolean
        default: true
      project_path:
        description: "Ruta o glob al .sln/.slnx/.csproj. Por defecto '**/*.sln'."
        required: false
        type: string
        default: '**/*.sln'
      artifact_name:
        description: 'Artifact que se construye una vez y consumen todos los deploys'
        required: false
        type: string
        default: app-drop
      dotnet_version:
        description: 'Version(es) del SDK de .NET (multilinea para varias)'
        required: false
        type: string
        default: '8.x'
      unit_test_project:
        description: 'Glob de tests unitarios. Vacio = no ejecutar.'
        required: false
        type: string
        default: '**/*UnitTest*.csproj'
      integration_test_project:
        description: 'Glob de integration tests. Vacio = no ejecutar.'
        required: false
        type: string
        default: '**/*IntegrationTest*.csproj'
      retention_days:
        description: 'Retencion del artifact (debe cubrir la ventana de aprobaciones)'
        required: false
        type: number
        default: 7
      deploy_int:
        description: 'Desplegar int'
        required: false
        type: boolean
        default: true
      deploy_sbx:
        description: 'Desplegar sbx (recursos con sufijo dev)'
        required: false
        type: boolean
        default: true
      deploy_pro:
        description: 'Desplegar pro (slot staging + swap)'
        required: false
        type: boolean
        default: true
      function_app_prefix:
        description: 'Prefijo de la Function App (<prefijo>-<entorno>). Vacio = var FUNCTION_APP_NAME del environment.'
        required: false
        type: string
        default: ''
      resource_group_prefix:
        description: 'Prefijo del RG (<PREFIJO>-<ENTORNO>). Vacio = var RESOURCE_GROUP del environment.'
        required: false
        type: string
        default: ''
      key_vault_prefix:
        description: 'Prefijo del Key Vault. Vacio = var KEY_VAULT_NAME del environment.'
        required: false
        type: string
        default: ''
      app_config_prefix:
        description: 'Prefijo de App Configuration. Vacio = var APP_CONFIG_NAME del environment.'
        required: false
        type: string
        default: ''
      label:
        description: 'Label de App Configuration. Vacio = var LABEL del environment.'
        required: false
        type: string
        default: ''
      url_value_prefix:
        description: 'Clave de App Config para la URL base. Vacio = var URL_VALUE_PREFIX del environment.'
        required: false
        type: string
        default: ''
      api_key_value_prefix:
        description: 'Clave de App Config para la API key. Vacio = var API_KEY_VALUE_PREFIX del environment.'
        required: false
        type: string
        default: ''
    secrets:
      APS_NUGET_TOKEN:
        description: 'PAT con scope read:packages para feeds NuGet privados'
        required: true
      NUGET_EXTERNAL_TOKEN:
        description: 'Token opcional para feeds NuGet externos'
        required: false

jobs:
  build:
    name: Build & Unit Tests
    if: ${{ inputs.build }}
    uses: ./.github/workflows/dotnet-build.yml
    with:
      project_path: ${{ inputs.project_path }}
      artifact_name: ${{ inputs.artifact_name }}
      dotnet_version: ${{ inputs.dotnet_version }}
      unit_test_project: ${{ inputs.unit_test_project }}
      retention_days: ${{ inputs.retention_days }}
    secrets: inherit

  int-tests:
    name: Integration tests INT
    needs: [build]
    if: ${{ always()
            && needs.build.result != 'failure' && needs.build.result != 'cancelled'
            && inputs.deploy_int }}
    uses: ./.github/workflows/azure-functions-integration-tests.yml
    with:
      environment: int
      integration_test_project: ${{ inputs.integration_test_project }}
      dotnet_version: ${{ inputs.dotnet_version }}
      azure_client_id: ${{ vars.AZURE_CLIENT_ID_INT }}
      azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID_INT }}
    secrets: inherit

  int-deploy:
    name: Deploy INT
    needs: int-tests
    if: ${{ always()
            && needs.int-tests.result != 'failure' && needs.int-tests.result != 'cancelled'
            && inputs.deploy_int }}
    uses: ./.github/workflows/azure-functions-deploy.yml
    with:
      environment: int
      function_app_name: ${{ inputs.function_app_prefix != '' && format('{0}-int', inputs.function_app_prefix) || '' }}
      resource_group: ${{ inputs.resource_group_prefix != '' && format('{0}-INT', inputs.resource_group_prefix) || '' }}
      artifact_name: ${{ inputs.artifact_name }}
      azure_client_id: ${{ vars.AZURE_CLIENT_ID_INT }}
      azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID_INT }}
    secrets: inherit

  int-config:
    name: Config sync INT
    needs: int-deploy
    if: ${{ always()
            && needs.int-deploy.result != 'failure' && needs.int-deploy.result != 'cancelled'
            && inputs.deploy_int }}
    uses: ./.github/workflows/azure-functions-config-sync.yml
    with:
      environment: int
      function_app_name: ${{ inputs.function_app_prefix != '' && format('{0}-int', inputs.function_app_prefix) || '' }}
      resource_group: ${{ inputs.resource_group_prefix != '' && format('{0}-INT', inputs.resource_group_prefix) || '' }}
      key_vault_name: ${{ inputs.key_vault_prefix != '' && format('{0}-int', inputs.key_vault_prefix) || '' }}
      app_config_name: ${{ inputs.app_config_prefix != '' && format('{0}-int', inputs.app_config_prefix) || '' }}
      label: ${{ inputs.label }}
      url_value_prefix: ${{ inputs.url_value_prefix }}
      api_key_value_prefix: ${{ inputs.api_key_value_prefix }}
      azure_client_id: ${{ vars.AZURE_CLIENT_ID_INT }}
      azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID_INT }}
    secrets: inherit

  sbx-tests:
    name: Integration tests SBX
    needs: int-config
    if: ${{ always()
            && needs.int-config.result != 'failure' && needs.int-config.result != 'cancelled'
            && inputs.deploy_sbx }}
    uses: ./.github/workflows/azure-functions-integration-tests.yml
    with:
      environment: sbx
      integration_test_project: ${{ inputs.integration_test_project }}
      dotnet_version: ${{ inputs.dotnet_version }}
      azure_client_id: ${{ vars.AZURE_CLIENT_ID_SBX }}
      azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID_SBX }}
    secrets: inherit

  sbx-deploy:
    name: Deploy SBX
    needs: sbx-tests
    if: ${{ always()
            && needs.sbx-tests.result != 'failure' && needs.sbx-tests.result != 'cancelled'
            && inputs.deploy_sbx }}
    uses: ./.github/workflows/azure-functions-deploy.yml
    with:
      environment: sbx
      function_app_name: ${{ inputs.function_app_prefix != '' && format('{0}-dev', inputs.function_app_prefix) || '' }}
      resource_group: ${{ inputs.resource_group_prefix != '' && format('{0}-DEV', inputs.resource_group_prefix) || '' }}
      artifact_name: ${{ inputs.artifact_name }}
      azure_client_id: ${{ vars.AZURE_CLIENT_ID_SBX }}
      azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID_SBX }}
    secrets: inherit

  sbx-config:
    name: Config sync SBX
    needs: sbx-deploy
    if: ${{ always()
            && needs.sbx-deploy.result != 'failure' && needs.sbx-deploy.result != 'cancelled'
            && inputs.deploy_sbx }}
    uses: ./.github/workflows/azure-functions-config-sync.yml
    with:
      environment: sbx
      function_app_name: ${{ inputs.function_app_prefix != '' && format('{0}-dev', inputs.function_app_prefix) || '' }}
      resource_group: ${{ inputs.resource_group_prefix != '' && format('{0}-DEV', inputs.resource_group_prefix) || '' }}
      key_vault_name: ${{ inputs.key_vault_prefix != '' && format('{0}-dev', inputs.key_vault_prefix) || '' }}
      app_config_name: ${{ inputs.app_config_prefix != '' && format('{0}-dev', inputs.app_config_prefix) || '' }}
      label: ${{ inputs.label }}
      url_value_prefix: ${{ inputs.url_value_prefix }}
      api_key_value_prefix: ${{ inputs.api_key_value_prefix }}
      azure_client_id: ${{ vars.AZURE_CLIENT_ID_SBX }}
      azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID_SBX }}
    secrets: inherit

  pro-tests:
    name: Integration tests PRO
    needs: sbx-config
    if: ${{ always()
            && needs.sbx-config.result != 'failure' && needs.sbx-config.result != 'cancelled'
            && inputs.deploy_pro }}
    uses: ./.github/workflows/azure-functions-integration-tests.yml
    with:
      environment: pro
      integration_test_project: ${{ inputs.integration_test_project }}
      dotnet_version: ${{ inputs.dotnet_version }}
      azure_client_id: ${{ vars.AZURE_CLIENT_ID_PRO }}
      azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID_PRO }}
    secrets: inherit

  pro-deploy:
    name: Deploy PRO (staging)
    needs: pro-tests
    if: ${{ always()
            && needs.pro-tests.result != 'failure' && needs.pro-tests.result != 'cancelled'
            && inputs.deploy_pro }}
    uses: ./.github/workflows/azure-functions-deploy.yml
    with:
      environment: pro
      function_app_name: ${{ inputs.function_app_prefix != '' && format('{0}-pro', inputs.function_app_prefix) || '' }}
      resource_group: ${{ inputs.resource_group_prefix != '' && format('{0}-PRO', inputs.resource_group_prefix) || '' }}
      artifact_name: ${{ inputs.artifact_name }}
      slot: staging
      azure_client_id: ${{ vars.AZURE_CLIENT_ID_PRO }}
      azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID_PRO }}
    secrets: inherit

  swap-pro:
    name: Swap PRO
    needs: pro-deploy
    if: ${{ always()
            && needs.pro-deploy.result != 'failure' && needs.pro-deploy.result != 'cancelled'
            && inputs.deploy_pro }}
    uses: ./.github/workflows/azure-slot-swap.yml
    with:
      environment: pro
      app_type: function
      app_name: ${{ inputs.function_app_prefix != '' && format('{0}-pro', inputs.function_app_prefix) || '' }}
      resource_group: ${{ inputs.resource_group_prefix != '' && format('{0}-PRO', inputs.resource_group_prefix) || '' }}
      source_slot: staging
      target_slot: production
      azure_client_id: ${{ vars.AZURE_CLIENT_ID_PRO }}
      azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID_PRO }}
    secrets: inherit

  pro-config:
    name: Config sync PRO
    needs: swap-pro
    if: ${{ always()
            && needs.swap-pro.result != 'failure' && needs.swap-pro.result != 'cancelled'
            && inputs.deploy_pro }}
    uses: ./.github/workflows/azure-functions-config-sync.yml
    with:
      environment: pro
      function_app_name: ${{ inputs.function_app_prefix != '' && format('{0}-pro', inputs.function_app_prefix) || '' }}
      resource_group: ${{ inputs.resource_group_prefix != '' && format('{0}-PRO', inputs.resource_group_prefix) || '' }}
      key_vault_name: ${{ inputs.key_vault_prefix != '' && format('{0}-pro', inputs.key_vault_prefix) || '' }}
      app_config_name: ${{ inputs.app_config_prefix != '' && format('{0}-pro', inputs.app_config_prefix) || '' }}
      label: ${{ inputs.label }}
      url_value_prefix: ${{ inputs.url_value_prefix }}
      api_key_value_prefix: ${{ inputs.api_key_value_prefix }}
      azure_client_id: ${{ vars.AZURE_CLIENT_ID_PRO }}
      azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID_PRO }}
    secrets: inherit
