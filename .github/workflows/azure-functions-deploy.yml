name: Azure Functions Deploy

# Workflow reutilizable: deploy de una Function App.
# Etapa del flujo build once / promote: NO compila; consume el artifact de dotnet-build.yml.
#
# Orden dentro del mismo job:
#   1. Validacion de configuracion (app, RG y, si aplica, Key Vault / App Configuration)
#   2. Deploy del artifact
#
# Los integration tests y el config sync viven en workflows propios
# (azure-functions-integration-tests.yml y azure-functions-config-sync.yml) para que
# cada operacion del stage sea una LINEA visible en el run:
#   tests -> deploy -> config sync (INT/SBX) / tests -> deploy (PRO) / swap -> config sync (PRO).
#
# Los bloques viven en composite actions (.github/actions/*) para reutilizarse sin
# duplicar logica.
#
# Uso recomendado: pipeline-functions.yml (orquesta build -> int -> sbx -> pro -> swap -> config).
#
# Resolucion de configuracion (todo cae al GitHub Environment si no se pasa input):
#   - function_app_name    -> vars.FUNCTION_APP_NAME
#   - resource_group       -> vars.RESOURCE_GROUP (o se resuelve por nombre)
#   - azure_*              -> secrets.AZURE_* (o vars de org sufijadas, que pasa el orquestador)
#
# NOTA: los deployment slots de Functions requieren plan Premium o Dedicated; no estan
# disponibles en Consumption.

on:
  workflow_call:
    inputs:
      environment:
        description: 'GitHub Environment del deploy (solo informativo; el gate de aprobacion vive en el job de integration tests del stage)'
        required: false
        type: string
        default: ''
      function_app_name:
        description: 'Nombre de la Function App. Vacio = usa la variable FUNCTION_APP_NAME del environment.'
        required: false
        type: string
        default: ''
      resource_group:
        description: 'Resource group. Vacio = usa la variable RESOURCE_GROUP del environment o lo resuelve por nombre.'
        required: false
        type: string
        default: ''
      artifact_name:
        description: 'Artifact generado por dotnet-build.yml'
        required: false
        type: string
        default: app-drop
      slot:
        description: "Slot destino. Vacio = production. Ej: 'staging' para el deploy previo al swap."
        required: false
        type: string
        default: ''
      integration_test_project:
        description: 'Glob de proyectos de integration test. Vacio = no ejecutar tests.'
        required: false
        type: string
        default: '**/*IntegrationTest*.csproj'
      integration_test_stage:
        description: 'Valor de TEST_STAGE para los tests. Vacio = environment en mayusculas.'
        required: false
        type: string
        default: ''
      dotnet_version:
        description: 'Version(es) del SDK de .NET a instalar (multilinea para varias)'
        required: false
        type: string
        default: '8.x'
      configuration:
        description: 'Configuracion usada por los integration tests'
        required: false
        type: string
        default: Release
      key_vault_name:
        description: 'Key Vault destino del config sync. Vacio = usa KEY_VAULT_NAME del environment.'
        required: false
        type: string
        default: ''
      app_config_name:
        description: 'App Configuration destino del config sync. Vacio = usa APP_CONFIG_NAME del environment.'
        required: false
        type: string
        default: ''
      label:
        description: 'Label de App Configuration. Vacio = usa LABEL del environment.'
        required: false
        type: string
        default: ''
      url_value_prefix:
        description: 'Clave de App Config para la URL base. Vacio = usa URL_VALUE_PREFIX del environment.'
        required: false
        type: string
        default: ''
      api_key_value_prefix:
        description: 'Clave de App Config para la API key. Vacio = usa API_KEY_VALUE_PREFIX del environment.'
        required: false
        type: string
        default: ''
      api_key_vault_name:
        description: "Nombre del secreto en Key Vault. Vacio = api_key_value_prefix con '.' reemplazado por '-'."
        required: false
        type: string
        default: ''
      function_key_name:
        description: 'Nombre de la function key a publicar (functionKeys.<nombre>)'
        required: false
        type: string
        default: 'default'
      azure_client_id:
        description: 'Client ID OIDC. Vacio = usa el secret AZURE_CLIENT_ID del environment.'
        required: false
        type: string
        default: ''
      azure_tenant_id:
        description: 'Tenant ID. Vacio = usa el secret AZURE_TENANT_ID del environment.'
        required: false
        type: string
        default: ''
      azure_subscription_id:
        description: 'Subscription ID. Vacio = usa el secret AZURE_SUBSCRIPTION_ID del environment.'
        required: false
        type: string
        default: ''
    secrets:
      AZURE_CLIENT_ID:
        description: 'Client ID para OIDC (alternativa al input azure_client_id)'
        required: false
      AZURE_TENANT_ID:
        description: 'Tenant ID de Azure AD (alternativa al input azure_tenant_id)'
        required: false
      AZURE_SUBSCRIPTION_ID:
        description: 'Subscription ID de Azure (alternativa al input azure_subscription_id)'
        required: false
      APS_NUGET_TOKEN:
        description: 'PAT con scope read:packages para feeds NuGet privados'
        required: true
      NUGET_EXTERNAL_TOKEN:
        description: 'Token opcional para feeds NuGet externos'
        required: false

jobs:
  deploy:
    name: Deploy Function App
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      APP_NAME: ${{ inputs.function_app_name || vars.FUNCTION_APP_NAME }}
      RESOURCE_GROUP: ${{ inputs.resource_group || vars.RESOURCE_GROUP }}
      KEY_VAULT_NAME: ${{ inputs.key_vault_name || vars.KEY_VAULT_NAME }}
      APP_CONFIG_NAME: ${{ inputs.app_config_name || vars.APP_CONFIG_NAME }}
      LABEL: ${{ inputs.label || vars.LABEL }}
      URL_VALUE_PREFIX: ${{ inputs.url_value_prefix || vars.URL_VALUE_PREFIX }}
      API_KEY_VALUE_PREFIX: ${{ inputs.api_key_value_prefix || vars.API_KEY_VALUE_PREFIX }}
      API_KEY_VAULT_NAME: ${{ inputs.api_key_vault_name }}
      FUNCTION_KEY_NAME: ${{ inputs.function_key_name }}

    steps:
      # Validacion completa del entorno antes de ejecutar nada.
      - name: Validate configuration
        run: |
          set -euo pipefail
          missing=()
          [ -z "$APP_NAME" ] && missing+=("FUNCTION_APP_NAME (o input function_app_name)")
          if [ -n "$URL_VALUE_PREFIX" ] || [ -n "$API_KEY_VALUE_PREFIX" ]; then
            [ -z "$KEY_VAULT_NAME" ] && missing+=("KEY_VAULT_NAME")
            [ -z "$APP_CONFIG_NAME" ] && missing+=("APP_CONFIG_NAME")
            [ -z "$LABEL" ] && missing+=("LABEL")
            [ -z "$URL_VALUE_PREFIX" ] && missing+=("URL_VALUE_PREFIX")
            [ -z "$API_KEY_VALUE_PREFIX" ] && missing+=("API_KEY_VALUE_PREFIX")
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Faltan variables en el environment '${{ inputs.environment }}': ${missing[*]}"
            exit 1
          fi
          if [ -z "${URL_VALUE_PREFIX}${API_KEY_VALUE_PREFIX}" ]; then
            echo "::notice::Config sync deshabilitado (sin URL_VALUE_PREFIX/API_KEY_VALUE_PREFIX)."
          fi

      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ inputs.azure_client_id || vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ inputs.azure_tenant_id || vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ inputs.azure_subscription_id || vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions
        id: deploy
        uses: APS-Framework/.github/.github/actions/function-deploy@main
        with:
          function_app_name: ${{ env.APP_NAME }}
          resource_group: ${{ env.RESOURCE_GROUP }}
          artifact_name: ${{ inputs.artifact_name }}
          slot: ${{ inputs.slot }}

      - name: Deployment summary
        if: always()
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | \`${{ inputs.environment }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Function App** | \`$APP_NAME\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Slot** | \`${{ inputs.slot || 'production' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Artifact** | \`${{ inputs.artifact_name }}\` |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.deploy.outcome }}" == "success" ]; then
            echo "| **Deploy** | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **Deploy** | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
