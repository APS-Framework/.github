name: Azure Functions Deploy

# Workflow reutilizable: integration tests + deploy de una Function App desde un artifact.
# Etapa del flujo build once / promote: NO compila; consume el artifact de dotnet-build.yml.
#
# Uso recomendado: pipeline-functions.yml (orquesta build -> int -> sbx -> pro -> swap -> config).
# Uso directo: encadenar bloques a mano con needs (composicion avanzada).
#
# Resolucion de configuracion (todo cae al GitHub Environment si no se pasa input):
#   - function_app_name  -> vars.FUNCTION_APP_NAME
#   - resource_group     -> vars.RESOURCE_GROUP (o se resuelve por nombre)
#   - azure_*            -> secrets.AZURE_*  (o vars de org sufijadas, que pasa el orquestador)
#
# Los integration tests corren como gate previo al deploy dentro del mismo job,
# contra el entorno del GitHub Environment. TEST_STAGE = environment en mayusculas
# y reciben APP_CONFIG_CONNECTION / APP_CONFIG_ENDPOINT si estan definidos.
#
# NOTA: los deployment slots de Functions requieren plan Premium o Dedicated;
# no estan disponibles en Consumption. Sin input 'slot' el deploy va a production.

on:
  workflow_call:
    inputs:
      environment:
        description: 'GitHub Environment del deploy (int, sbx, pro…)'
        required: true
        type: string
      function_app_name:
        description: 'Nombre de la Function App. Vacio = usa la variable FUNCTION_APP_NAME del environment.'
        required: false
        type: string
        default: ''
      resource_group:
        description: 'Resource group. Vacio = usa la variable RESOURCE_GROUP del environment o lo resuelve por nombre.'
        required: false
        type: string
        default: ''
      artifact_name:
        description: 'Artifact generado por dotnet-build.yml'
        required: false
        type: string
        default: app-drop
      slot:
        description: "Slot destino. Vacio = production. Ej: 'staging' para el deploy previo al swap."
        required: false
        type: string
        default: ''
      integration_test_project:
        description: 'Glob de proyectos de integration test. Vacio = no ejecutar tests.'
        required: false
        type: string
        default: '**/*IntegrationTest*.csproj'
      integration_test_stage:
        description: 'Valor de TEST_STAGE para los tests. Vacio = environment en mayusculas.'
        required: false
        type: string
        default: ''
      dotnet_version:
        description: 'Version(es) del SDK de .NET a instalar (multilinea para varias)'
        required: false
        type: string
        default: '8.x'
      configuration:
        description: 'Configuracion usada por los integration tests'
        required: false
        type: string
        default: Release
      azure_client_id:
        description: 'Client ID OIDC. Vacio = usa el secret AZURE_CLIENT_ID del environment.'
        required: false
        type: string
        default: ''
      azure_tenant_id:
        description: 'Tenant ID. Vacio = usa el secret AZURE_TENANT_ID del environment.'
        required: false
        type: string
        default: ''
      azure_subscription_id:
        description: 'Subscription ID. Vacio = usa el secret AZURE_SUBSCRIPTION_ID del environment.'
        required: false
        type: string
        default: ''
    secrets:
      AZURE_CLIENT_ID:
        description: 'Client ID para OIDC (alternativa al input azure_client_id)'
        required: false
      AZURE_TENANT_ID:
        description: 'Tenant ID de Azure AD (alternativa al input azure_tenant_id)'
        required: false
      AZURE_SUBSCRIPTION_ID:
        description: 'Subscription ID de Azure (alternativa al input azure_subscription_id)'
        required: false
      APS_NUGET_TOKEN:
        description: 'PAT con scope read:packages para feeds NuGet privados'
        required: true
      NUGET_EXTERNAL_TOKEN:
        description: 'Token opcional para feeds NuGet externos'
        required: false

jobs:
  deploy:
    name: Deploy Function App
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    env:
      APP_NAME: ${{ inputs.function_app_name || vars.FUNCTION_APP_NAME }}
      RESOURCE_GROUP: ${{ inputs.resource_group || vars.RESOURCE_GROUP }}

    steps:
      - name: Validate configuration
        run: |
          set -euo pipefail
          if [ -z "$APP_NAME" ]; then
            echo "::error::FUNCTION_APP_NAME no definida. Configura la variable en el environment '${{ inputs.environment }}' o pasa function_app_name."
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ inputs.azure_client_id || vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ inputs.azure_tenant_id || vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ inputs.azure_subscription_id || vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      # Gate previo al deploy. Los tests usan la identidad OIDC del job
      # (azure/login autentica el CLI, por lo que DefaultAzureCredential ->
      # AzureCliCredential funciona sin credenciales adicionales).
      - name: Integration tests
        if: inputs.integration_test_project != ''
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          stage="$INTEGRATION_TEST_STAGE"
          if [ -z "$stage" ]; then
            stage=$(echo "$ENVIRONMENT" | tr '[:lower:]' '[:upper:]')
          fi
          export TEST_STAGE="$stage"

          files=( $INTEGRATION_TEST_PROJECT )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No se encontro ningun proyecto con el patron '$INTEGRATION_TEST_PROJECT'."
            exit 1
          fi

          projects=()
          for file in "${files[@]}"; do
            case "$file" in
              */bin/*|*/obj/*) continue ;;
            esac
            projects+=("$file")
          done
          if [ ${#projects[@]} -eq 0 ]; then
            echo "::error::Solo hubo coincidencias en bin/obj para '$INTEGRATION_TEST_PROJECT'."
            exit 1
          fi

          for project in "${projects[@]}"; do
            echo "== dotnet test ${project} (TEST_STAGE=$TEST_STAGE) =="
            dotnet test "$project" --configuration "$CONFIGURATION" --filter "TestCategory=Integration"
          done
        env:
          INTEGRATION_TEST_PROJECT: ${{ inputs.integration_test_project }}
          INTEGRATION_TEST_STAGE: ${{ inputs.integration_test_stage }}
          ENVIRONMENT: ${{ inputs.environment }}
          CONFIGURATION: ${{ inputs.configuration }}
          APP_CONFIG_CONNECTION: ${{ secrets.APP_CONFIG_CONNECTION }}
          APP_CONFIG_ENDPOINT: ${{ vars.APP_CONFIG_ENDPOINT }}
          APS_NUGET_TOKEN: ${{ secrets.APS_NUGET_TOKEN }}
          NUGET_EXTERNAL_TOKEN: ${{ secrets.NUGET_EXTERNAL_TOKEN }}

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}
          path: ./publish

      - name: Deploy to Azure Functions
        id: deploy
        run: |
          set -euo pipefail
          RG="$RESOURCE_GROUP"
          if [ -z "$RG" ]; then
            RG=$(az functionapp list --query "[?name=='$APP_NAME'].resourceGroup" -o tsv)
          fi
          if [ -z "$RG" ]; then
            echo "::error::No se encontro la Function App '$APP_NAME'."
            exit 1
          fi

          cd ./publish
          zip -r ../function-app.zip .
          cd ..

          SLOT_ARGS=()
          if [ -n "$SLOT" ]; then
            SLOT_ARGS=(--slot "$SLOT")
          fi

          az functionapp deployment source config-zip \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --src ./function-app.zip \
            --build-remote false \
            "${SLOT_ARGS[@]}"
        env:
          SLOT: ${{ inputs.slot }}

      - name: Deployment summary
        if: always()
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | \`${{ inputs.environment }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Function App** | \`$APP_NAME\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Slot** | \`${{ inputs.slot || 'production' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Artifact** | \`${{ inputs.artifact_name }}\` |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.deploy.outcome }}" == "success" ]; then
            echo "| **Status** | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **Status** | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
